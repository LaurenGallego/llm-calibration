[project]
name = "madcal"
version = "0.0.1"
description = "Measuring how per-agent calibration error propagates through multi-agent debate"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "duckdb>=1.0",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "accelerate>=0.30",
    "torch>=2.4",
    "transformers>=4.44",
]

[project.optional-dependencies]
# vLLM is Linux/CUDA only -- it does not build on macOS, so it cannot be a core
# dependency without breaking `uv sync` on the development machine.
vllm = [
    "vllm>=0.6",
]
dev = [
    "import-linter>=2.0",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/madcal"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.importlinter]
root_packages = ["madcal"]

[[tool.importlinter.contracts]]
name = "signals never reach a label"
type = "forbidden"
source_modules = ["madcal.signals"]
forbidden_modules = [
    "madcal.benchmarks",
    "madcal.debate",
    "madcal.metrics",
    "madcal.orchestration",
    "madcal.storage",
]

[[tool.importlinter.contracts]]
name = "debate engine never reaches a label or storage"
type = "forbidden"
source_modules = ["madcal.debate"]
forbidden_modules = [
    "madcal.benchmarks",
    "madcal.metrics",
    "madcal.orchestration",
    "madcal.storage",
]
