[project]
name = "caldrift"
version = "0.0.1"
description = "Detecting calibration drift in LLMs from unlabeled confidence signals"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "duckdb>=1.0",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "accelerate>=0.30",
    "torch>=2.4",
    "transformers>=4.44",
]

[project.optional-dependencies]
# vLLM is Linux/CUDA only -- it does not build on macOS, so it cannot be a core
# dependency without breaking `uv sync` on the development machine.
vllm = [
    "vllm>=0.6",
]
dev = [
    "import-linter>=2.0",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caldrift"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.importlinter]
root_packages = ["caldrift"]

# The label-leakage boundary, machine-checked. `benchmarks` is on this list because
# `Question.answer` *is* the ground-truth label, not only because of what the package
# is named -- the original "signals must not import metrics" rule left that hole open.
# Indirect chains count: signals -> judges -> benchmarks breaks this too, which is the
# case that will actually matter once `judges/` exists.
#
# Modules must exist to be listed. `caldrift.judges`, `caldrift.drift`,
# `caldrift.orchestration` and `caldrift.analysis` are added to `forbidden_modules` by
# the commit that creates each of them.
[[tool.importlinter.contracts]]
name = "signals never reach a label"
type = "forbidden"
source_modules = ["caldrift.signals"]
forbidden_modules = [
    "caldrift.benchmarks",
    "caldrift.metrics",
    "caldrift.storage",
]
